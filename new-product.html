<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dragZone = document.querySelector('.border-dashed');

            if(dragZone) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dragZone.addEventListener(eventName, preventDefaults, false);
                });

                function preventDefaults (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                ['dragenter', 'dragover'].forEach(eventName => {
                    dragZone.addEventListener(eventName, highlight, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    dragZone.addEventListener(eventName, unhighlight, false);
                });

                function highlight(e) {
                    dragZone.classList.add('border-blue-600', 'bg-blue-50');
                }

                function unhighlight(e) {
                    dragZone.classList.remove('border-blue-600', 'bg-blue-50');
                }
            }
        });
    </script>
